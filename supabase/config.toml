# Only the properties declared here are pushed to the hosted project
# (`npm run config:push`); everything else stays as set on the server.
# Full reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "tholloway91"

[auth]
# Where auth emails (password reset) send people back to. The app lives on Vercel;
# localhost is for development. `**` allows any path, e.g. /reset-password.
site_url = "https://havarc.vercel.app"
additional_redirect_urls = ["https://havarc.vercel.app/**", "http://localhost:5173/**"]
# Matches the app's own rule: "At least 8 characters, including a number."
minimum_password_length = 8
password_requirements = "letters_digits"
# The two technician accounts are created by us; nobody self-registers.
# (This is the project-wide "allow new users to sign up" switch.)
enable_signup = false

[auth.email]
# Keep the email+password provider ON — `enable_signup` here toggles the whole
# provider and turning it off disables sign-in too ("Email logins are disabled").
enable_signup = true
enable_confirmations = false
secure_password_change = false

# Outgoing mail: Brevo SMTP relay (free tier, 300/day). Credentials come from .env.local
# via `dotenv -e .env.local` in the npm scripts, so nothing secret is committed.
[auth.email.smtp]
enabled = true
host = "smtp-relay.brevo.com"
port = 587
user = "env(SMTP_USER)"
pass = "env(SMTP_PASS)"
# Must be a sender verified in Brevo (single-sender verification, no DNS needed).
admin_email = "env(SMTP_SENDER)"
sender_name = "HAV'ARC Heating and Air"

[auth.email.template.recovery]
subject = "HAV'ARC — Reset your password"
content_path = "./supabase/templates/recovery.html"
